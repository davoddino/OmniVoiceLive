<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebSocket Test</title>
    <style>
      :root {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1d2430;
        background: #eef2f6;
      }
      body {
        margin: 0;
        padding: 20px;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
      }
      button {
        height: 42px;
        border: 1px solid #1f6feb;
        border-radius: 6px;
        background: #1f6feb;
        color: #fff;
        padding: 0 14px;
        font: inherit;
        font-weight: 700;
      }
      pre {
        min-height: 280px;
        overflow: auto;
        border: 1px solid #d9e0ea;
        border-radius: 8px;
        background: #fff;
        padding: 14px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WebSocket Test</h1>
      <p>Questo test apre solo <code>/ws-ping</code>, senza microfono, STT, LLM o TTS.</p>
      <button id="start">Test WebSocket</button>
      <pre id="log"></pre>
    </main>
    <script>
      const log = document.getElementById("log");
      const button = document.getElementById("start");

      function write(line) {
        log.textContent += `${new Date().toLocaleTimeString()} ${line}\n`;
      }

      button.addEventListener("click", () => {
        const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
        const url = `${wsProto}//${location.host}/ws-ping`;
        write(`opening ${url}`);
        const ws = new WebSocket(url);
        const timer = setTimeout(() => {
          write(`timeout readyState=${ws.readyState}`);
          ws.close();
        }, 5000);

        ws.onopen = () => {
          clearTimeout(timer);
          write("open");
          ws.send("hello");
        };
        ws.onmessage = (event) => {
          write(`message ${event.data}`);
        };
        ws.onerror = () => {
          write("error");
        };
        ws.onclose = (event) => {
          clearTimeout(timer);
          write(`close code=${event.code} reason=${event.reason || "-"}`);
        };
      });
    </script>
  </body>
</html>
