<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OmniVoice Live</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div class="brandRow">
          <div class="productMark">OV</div>
          <div>
            <h1>CavadaLabs Voice Desk</h1>
            <p id="sessionLabel">Sessione non avviata</p>
          </div>
        </div>
        <div class="topControls">
          <div class="callMeta">
            <span id="transportLabel" class="statusBadge">HTTPS/WSS</span>
            <span id="timerLabel" class="timer">00:00</span>
          </div>
          <label class="languageControl modeControl">
            <span>Modalità</span>
            <select id="sessionModeSelect">
              <option value="agent" selected>Agente CavadaLabs</option>
              <option value="translator">Traduttore live</option>
            </select>
          </label>
          <label class="languageControl sourceLanguageControl hidden" id="sourceLanguageControl">
            <span>Da</span>
            <select id="sourceLanguageSelect">
              <option value="auto" selected>Auto rilevamento</option>
              <option value="it">Italiano</option>
              <option value="en">English</option>
              <option value="de">Tedesco (Deutsch)</option>
              <option value="fr">Francese (Français)</option>
              <option value="es">Spagnolo (Español)</option>
              <option value="pt">Portoghese (Português)</option>
              <option value="ro">Rumeno (Română)</option>
              <option value="sq">Albanese (Shqip)</option>
              <option value="ru">Russo (Русский)</option>
              <option value="uk">Ucraino (Українська)</option>
              <option value="pl">Polski</option>
              <option value="sr">Serbo/Croato/Bosniaco</option>
              <option value="hr">Croato (Hrvatski)</option>
              <option value="bs">Bosniaco (Bosanski)</option>
              <option value="ar">Arabo (العربية)</option>
              <option value="zh">Cinese semplificato (简体中文)</option>
              <option value="hi">Hindi (हिन्दी)</option>
              <option value="ur">Urdu (اردو)</option>
              <option value="sw">Swahili (Kiswahili)</option>
            </select>
          </label>
          <label class="languageControl">
            <span id="languageSelectLabel">Lingua agente</span>
            <select id="languageSelect">
              <option value="it" selected>Italiano</option>
              <option value="en">English</option>
              <option value="de">Tedesco (Deutsch)</option>
              <option value="fr">Francese (Français)</option>
              <option value="es">Spagnolo (Español)</option>
              <option value="pt">Portoghese (Português)</option>
              <option value="ro">Rumeno (Română)</option>
              <option value="sq">Albanese (Shqip)</option>
              <option value="ru">Russo (Русский)</option>
              <option value="uk">Ucraino (Українська)</option>
              <option value="pl">Polski</option>
              <option value="sr">Serbo/Croato/Bosniaco</option>
              <option value="hr">Croato (Hrvatski)</option>
              <option value="bs">Bosniaco (Bosanski)</option>
              <option value="ar">Arabo (العربية)</option>
              <option value="zh">Cinese semplificato (简体中文)</option>
              <option value="hi">Hindi (हिन्दी)</option>
              <option value="ur">Urdu (اردو)</option>
              <option value="sw">Swahili (Kiswahili)</option>
            </select>
          </label>
          <label class="languageControl timingControl hidden" id="translationTimingControl">
            <span>Timing</span>
            <select id="translationTimingSelect">
              <option value="immediate" selected>Parla subito</option>
              <option value="end_of_speech">Fine parlato</option>
            </select>
          </label>
          <label class="languageControl engineControl">
            <span>Engine TTS</span>
            <select id="ttsEngineSelect">
              <option value="omnivoice" selected>OmniVoice</option>
              <option value="qwen3_tts">Qwen3-TTS</option>
            </select>
          </label>
          <div class="actions">
            <button id="startButton" class="primary">Avvia chiamata</button>
            <button id="stopButton" disabled>Termina</button>
          </div>
        </div>
      </section>

      <section class="workspace">
        <aside class="statusPanel">
          <div class="statusBlock">
            <span class="label">Stato</span>
            <strong id="stateLabel">Idle</strong>
          </div>
          <div class="meterWrap">
            <span class="label">Microfono</span>
            <div class="meter">
              <div id="meterFill"></div>
            </div>
          </div>
          <div class="statusGrid">
            <div>
              <span class="label">STT</span>
              <strong id="sttLatency">-</strong>
            </div>
            <div>
              <span class="label">TTS</span>
              <strong id="ttsLatency">-</strong>
            </div>
            <div>
              <span class="label">Turno</span>
              <strong id="turnLabel">-</strong>
            </div>
            <div>
              <span class="label">Buffer</span>
              <strong id="bufferLabel">0 ms</strong>
            </div>
          </div>
          <div class="voiceCard">
            <span class="label">Voce</span>
            <strong id="voiceModeLabel">Voce OmniVoice stabile</strong>
            <span id="audioModeLabel">Audio in attesa</span>
          </div>
        </aside>

        <section class="conversationPanel">
          <div class="conversationHeader">
            <div>
              <span class="label">Timeline</span>
              <strong>Conversazione</strong>
            </div>
            <span id="connectionLabel" class="connectionPill">Offline</span>
          </div>
          <section class="conversation" id="conversation"></section>
        </section>
      </section>
    </main>

    <script src="/static/app.js?v=15" type="module"></script>
  </body>
</html>
